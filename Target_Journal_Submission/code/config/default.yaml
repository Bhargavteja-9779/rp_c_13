# Full protocol. All values were fixed before any deployment-batch result was inspected.
seeds: [0, 1, 2, 3, 4]
models: [lgbm, xgb, logreg, mlp]
main_model: lgbm
split: {n_folds: 10, train_folds: 5, val_folds: 2, test_folds: 3}
controlled:
  datasets: [creditcard, APSFailure, KDD09_appetency, porto_seguro, Amazon_employee, census_income,
             KDD09_churn, KDD09_upselling, Diabetes130US, bank_marketing, kick, online_shoppers,
             Click_small, jm1, default_credit, adult, MiniBooNE, nomao]
  odds_multipliers: [0.125, 0.25, 0.5, 1.0, 2.0, 4.0, 8.0]
  batch_sizes: [500, 2000, 10000]
  reps: 30
  extra_batch_sizes: [100]          # robustness (main model only)
  metrics_extra: [f0.5, f2, mcc]    # generalisation (main model only)
  noise_levels: [0.1, 0.25, 0.5]    # label-shift violation: Gaussian feature noise in units of feature SD
  val_fractions: [0.1, 0.25]        # robustness to small validation sets
real:
  suites: [bank_time, creditcard_time, electricity_time, elliptic_time, acs_income_states, kdd99_time]
method: {prior_sd: 2.0, guard_alpha: 0.01, n_grid: 161, calibrator: isotonic}
n_jobs: 4
